<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jàng – Gestion d'école privée (démo)</title>
<meta name="description" content="Prototype de plateforme de gestion d'école privée au Sénégal : élèves, scolarités et paiement mobile, notes et bulletins, absences, communication avec les parents.">
<meta name="theme-color" content="#0B3B2E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B3B2E'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' fill='%23F2B233' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --side:#0B3B2E; --side2:#114A3A; --green:#127A4B; --green-l:#E5F3EC;
  --amber:#F2B233; --amber-l:#FDF3DC; --red:#C2410C; --red-l:#FDECE3;
  --blue:#1D5FA8; --blue-l:#E6EFF9;
  --ink:#16201C; --muted:#5B6863; --line:#E2E8E5; --bg:#F4F6F5; --white:#fff;
  --radius:12px; --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{background:var(--side);color:#D7E6DF;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand .mark{width:38px;height:38px;border-radius:10px;background:var(--amber);color:var(--side);display:grid;place-items:center;font-weight:800;font-size:20px}
.brand b{display:block;color:#fff;font-size:18px;letter-spacing:.2px}
.brand small{color:#9CC3B2;font-size:12px}
.school{background:var(--side2);border-radius:10px;padding:10px 12px;font-size:13px}
.school b{color:#fff;display:block;font-size:13.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#D7E6DF;padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:500;min-height:42px}
.nav button:hover{background:var(--side2);color:#fff}
.nav button.active{background:var(--amber);color:var(--side);font-weight:700}
.nav .ico{width:20px;text-align:center;font-size:16px}
.side .foot{margin-top:auto;font-size:12px;color:#9CC3B2;padding:0 8px}
.side .foot button{background:none;border:1px solid #2E6352;color:#D7E6DF;border-radius:8px;padding:6px 10px;cursor:pointer;margin-top:8px;font-size:12px}

/* main */
main{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 32px 6px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;letter-spacing:-.3px}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.top .actions{display:flex;gap:8px;flex-wrap:wrap}
#view{padding:16px 32px 48px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--white);border-radius:9px;padding:0 14px;min-height:40px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#B9C7C0}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#0E6640}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--side)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn.wave{background:#1DC4F5;border-color:#1DC4F5;color:#06283a}
.btn.om{background:#FF7900;border-color:#FF7900;color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.two{grid-template-columns:1.3fr 1fr}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.card h3{margin:0 0 12px;font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 a,.card h3 button.link{font-size:13px;font-weight:600}
.kpi .label{color:var(--muted);font-size:13px;font-weight:500}
.kpi .value{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.alert .value{color:var(--red)}
.kpi.ok .value{color:var(--green)}

.bar-row{display:grid;grid-template-columns:44px 1fr 46px;gap:10px;align-items:center;margin:9px 0;font-size:13.5px}
.bar{height:10px;background:#EDF1EF;border-radius:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--green);border-radius:6px}
.bar span.mid{background:var(--amber)}
.bar span.low{background:var(--red)}
.bar-row .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #EEF2F0;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#F8FAF9}
.who{display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.who b{display:block;font-weight:600}
.who small{color:var(--muted);font-size:12px}

.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--green-l);color:var(--green)}
.b-warn{background:var(--amber-l);color:#8A5A00}
.b-bad{background:var(--red-l);color:var(--red)}
.b-info{background:var(--blue-l);color:var(--blue)}
.b-grey{background:#EEF1F0;color:var(--muted)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--white);border-radius:9px;padding:0 12px;min-height:40px;min-width:0}
textarea.input{padding:10px 12px;min-height:110px;width:100%;resize:vertical}
.input:focus{outline:2px solid #9BD3B8;border-color:var(--green)}
.search{flex:1;min-width:200px}
.tabs{display:flex;gap:4px;background:#E8EDEA;padding:4px;border-radius:10px;width:fit-content;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.active{background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.empty{color:var(--muted);text-align:center;padding:24px}
.muted{color:var(--muted)}
.right{text-align:right}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.space{justify-content:space-between}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.form .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #EEF2F0}
.list-item:last-child{border-bottom:0}
.note-input{width:76px;text-align:right}

/* attendance */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted);border-left:1px solid var(--line)}
.seg label:first-child span{border-left:0}
.seg input:checked+span.p{background:var(--green-l);color:var(--green)}
.seg input:checked+span.a{background:var(--red-l);color:var(--red)}
.seg input:checked+span.r{background:var(--amber-l);color:#8A5A00}
.seg input:focus-visible+span{outline:2px solid var(--green)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,25,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}
.modal[hidden]{display:none}
.modal-box{background:var(--white);border-radius:14px;width:100%;max-width:640px;padding:24px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-box.wide{max-width:820px}
.modal-box h2{margin:0 0 4px;font-size:20px}
.close{position:absolute;top:12px;right:12px;border:0;background:#F0F3F2;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* documents (reçu, bulletin) */
.doc{border:1px solid var(--line);border-radius:10px;padding:22px;margin-top:14px;background:#fff}
.doc-head{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--side);padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
.doc-head b{font-size:16px}
.doc-head small{display:block;color:var(--muted)}
.doc h4{text-align:center;margin:6px 0 14px;letter-spacing:1px;text-transform:uppercase;font-size:15px}
.doc table td,.doc table th{border:1px solid var(--line);padding:7px 9px}
.doc .total td{font-weight:700;background:#F6F8F7}
.doc .sign{display:flex;justify-content:space-between;margin-top:26px;font-size:13px;color:var(--muted)}
.stamp{display:inline-block;border:2px solid var(--green);color:var(--green);font-weight:800;padding:4px 10px;border-radius:6px;transform:rotate(-4deg);letter-spacing:1px}

/* phone mock (espace parent) */
.parent-layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:28px;align-items:start}
.phone{background:#111;border-radius:38px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.2);max-width:380px}
.screen{background:var(--bg);border-radius:28px;overflow:hidden;height:720px;display:flex;flex-direction:column}
.p-head{background:var(--side);color:#fff;padding:22px 18px 18px}
.p-head small{color:#9CC3B2}
.p-head select{margin-top:10px;width:100%;background:var(--side2);border:1px solid #2E6352;color:#fff;border-radius:9px;min-height:40px;padding:0 10px}
.p-body{padding:14px;overflow-y:auto;display:grid;gap:12px;align-content:start}
.p-card{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--line)}
.p-card h5{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.p-amount{font-size:24px;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.feature-list{margin:0;padding-left:18px;color:var(--muted)}
.feature-list li{margin:6px 0}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--side);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;transition:transform .25s;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.show{transform:translateX(-50%) translateY(0)}
.demo-banner{background:var(--amber-l);color:#6B4700;font-size:13px;padding:8px 32px;border-bottom:1px solid #F3DFAE}

@media (max-width:1000px){.two,.parent-layout{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{position:sticky;top:0;height:auto;z-index:20;padding:10px 12px;gap:8px;flex-direction:column}
  .school,.side .foot{display:none}
  .brand{padding:0}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px}
  .nav button{width:auto;white-space:nowrap;padding:8px 12px;min-height:38px}
  .top{padding:16px 16px 4px}
  #view{padding:12px 16px 40px}
  .demo-banner{padding:8px 16px}
  .form .cols{grid-template-columns:1fr}
  .hide-sm{display:none}
}
@media print{
  body *{visibility:hidden}
  .printable,.printable *{visibility:visible}
  .printable{position:absolute;left:0;top:0;width:100%;border:0;margin:0}
  .modal{position:absolute;background:none;padding:0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">J</div><div><b>Jàng</b><small>Gestion scolaire</small></div></div>
    <div class="school"><b id="school-name"></b><span id="school-year"></span></div>
    <nav class="nav" id="nav" aria-label="Navigation principale"></nav>
    <div class="foot">Prototype de démonstration.<br>Données fictives, enregistrées dans ce navigateur.<br><button id="reset">Réinitialiser la démo</button></div>
  </aside>
  <main>
    <div class="demo-banner">Démo : les noms, numéros et paiements sont fictifs. Aucun SMS ni paiement réel n'est envoyé.</div>
    <div class="top"><div><h1 id="page-title"></h1><p id="page-sub"></p></div><div class="actions" id="page-actions"></div></div>
    <div id="view"></div>
  </main>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="modal-box" id="modal-box"><button class="close" id="modal-close" aria-label="Fermer">×</button><div id="modal-body"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ Configuration ============ */
const SCHOOL = {nom:"Groupe Scolaire Les Baobabs", ville:"Parcelles Assainies, Dakar", annee:"2026-2027", tel:"33 800 00 00"};
const CLASSES = [
  {id:'CI', cycle:'Primaire', mens:15000, insc:25000, prof:'Mme Ndiaye'},
  {id:'CP', cycle:'Primaire', mens:15000, insc:25000, prof:'M. Faye'},
  {id:'CE1',cycle:'Primaire', mens:17500, insc:25000, prof:'Mme Sow'},
  {id:'CE2',cycle:'Primaire', mens:17500, insc:25000, prof:'M. Diallo'},
  {id:'CM1',cycle:'Primaire', mens:20000, insc:30000, prof:'M. Sarr'},
  {id:'CM2',cycle:'Primaire', mens:20000, insc:30000, prof:'Mme Gueye'},
  {id:'6e', cycle:'Collège',  mens:25000, insc:35000, prof:'M. Thiam'},
  {id:'5e', cycle:'Collège',  mens:25000, insc:35000, prof:'Mme Kane'},
];
const MOIS = ['Octobre','Novembre','Décembre','Janvier','Février','Mars','Avril','Mai','Juin'];
const MOIS_DUS = 2; // à la mi-novembre : octobre et novembre sont exigibles
const MATIERES = {
  'Primaire':[['Français',3],['Mathématiques',3],['Sciences d\'observation',2],['Histoire-Géographie',2],['Éducation civique',1],['Anglais',1],['EPS',1]],
  'Collège':[['Français',4],['Mathématiques',4],['Anglais',2],['SVT',2],['Histoire-Géographie',2],['Éducation civique',1],['EPS',1]],
};
const MODES = ['Espèces','Wave','Orange Money','Free Money'];
const STORE = 'jang-demo-v1';

/* ============ Utilitaires ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fcfa = n => Math.round(n).toLocaleString('fr-FR').replace(/ | /g,' ') + ' F';
const fdate = d => new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
const todayISO = () => new Date().toISOString().slice(0,10);
const classOf = id => CLASSES.find(c => c.id === id);
const subjects = cls => MATIERES[classOf(cls).cycle];
const initials = s => s.prenom[0] + s.nom[0];
const AV_COLORS = [['#E5F3EC','#127A4B'],['#E6EFF9','#1D5FA8'],['#FDF3DC','#8A5A00'],['#F3E8FA','#7A3EA8'],['#FDECE3','#C2410C']];
const avatar = s => { const [bg,fg] = AV_COLORS[s.id % AV_COLORS.length]; return `<span class="av" style="background:${bg};color:${fg}">${esc(initials(s))}</span>`; };
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ============ Données de démonstration ============ */
function seed(){
  const r = mulberry32(2026), pick = a => a[Math.floor(r()*a.length)];
  const PM = ['Moussa','Abdoulaye','Mamadou','Ousmane','Cheikh','Ibrahima','Modou','Pape','Babacar','Serigne','Aliou','Khadim','Saliou','Lamine','El Hadji','Assane','Omar','Malick'];
  const PF = ['Aïssatou','Fatou','Awa','Mariama','Khady','Ndèye','Coumba','Astou','Bineta','Sokhna','Adama','Rokhaya','Dieynaba','Mame Diarra','Seynabou','Marième','Oumou','Yacine'];
  const NOMS = ['Diop','Ndiaye','Fall','Sow','Ba','Diallo','Sarr','Faye','Gueye','Mbaye','Cissé','Seck','Ndour','Thiam','Camara','Sy','Kane','Diouf','Niang','Mendy','Dieng','Touré'];
  const students = [], payments = [], absences = [], grades = {};
  let id = 1, pid = 1;
  const year0 = {CI:2020,CP:2019,CE1:2018,CE2:2017,CM1:2016,CM2:2015,'6e':2014,'5e':2013};
  CLASSES.forEach(c => {
    const n = 18 + Math.floor(r()*9);
    for(let i=0;i<n;i++){
      const sexe = r() < .5 ? 'F' : 'M';
      const nom = pick(NOMS);
      const parentF = r() < .55;
      const s = {
        id:id++, prenom: pick(sexe==='F'?PF:PM), nom, sexe, classe:c.id,
        naissance: `${year0[c.id]}-${String(1+Math.floor(r()*12)).padStart(2,'0')}-${String(1+Math.floor(r()*28)).padStart(2,'0')}`,
        parent: (parentF ? 'Mme ' + pick(PF) : 'M. ' + pick(PM)) + ' ' + nom,
        tel: `${pick(['77','78','76','70'])} ${100+Math.floor(r()*899)} ${String(Math.floor(r()*100)).padStart(2,'0')} ${String(Math.floor(r()*100)).padStart(2,'0')}`,
      };
      students.push(s);
      // inscription
      const d1 = `2026-${pick(['09','09','10'])}-${String(1+Math.floor(r()*28)).padStart(2,'0')}`;
      payments.push({id:pid++, studentId:s.id, motif:'Inscription', mois:[], montant:c.insc, mode:pick(MODES), date:d1});
      // mensualités
      const x = r(); const k = x < .12 ? 0 : x < .36 ? 1 : x < .86 ? 2 : 3;
      for(let m=0;m<k;m++){
        const d = m===0 ? `2026-10-${String(2+Math.floor(r()*25)).padStart(2,'0')}` : `2026-11-${String(1+Math.floor(r()*15)).padStart(2,'0')}`;
        payments.push({id:pid++, studentId:s.id, motif:'Mensualité', mois:[m], montant:c.mens, mode:pick(MODES), date:d});
      }
      // notes de la 1re composition
      const base = 7 + r()*9;
      grades[s.id] = {};
      subjects(c.id).forEach(([m]) => { grades[s.id][m] = Math.max(2, Math.min(19.5, Math.round((base + (r()-.5)*7)*2)/2)); });
      // absences
      if(r() < .35){ const nb = 1 + Math.floor(r()*3); for(let a=0;a<nb;a++) absences.push({studentId:s.id, date:`2026-${pick(['10','11'])}-${String(1+Math.floor(r()*16)).padStart(2,'0')}`, type:r()<.65?'Absence':'Retard', justifie:r()<.5}); }
    }
  });
  const messages = [
    {date:'2026-11-03', canal:'WhatsApp', dest:'Toute l\'école', nb:students.length, texte:'Chers parents, la réunion du 1er trimestre aura lieu le samedi 22 novembre à 10h dans la cour de l\'école. Votre présence est vivement souhaitée.', auto:false},
    {date:'2026-10-28', canal:'SMS', dest:'CM2', nb:students.filter(s=>s.classe==='CM2').length, texte:'Rappel : la tenue scolaire est obligatoire à partir du lundi 3 novembre.', auto:false},
  ];
  return {students, payments, absences, grades, messages, nextPid:pid, nextId:id};
}
let DB;
function load(){ try{ DB = JSON.parse(localStorage.getItem(STORE)); }catch(e){ DB = null; } if(!DB || !DB.students) { DB = seed(); save(); } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(DB)); }catch(e){} }

/* ============ Calculs ============ */
const studentById = id => DB.students.find(s => s.id === +id);
const fullName = s => `${s.prenom} ${s.nom}`;
const paysOf = sid => DB.payments.filter(p => p.studentId === sid);
const paidMonths = sid => paysOf(sid).filter(p => p.motif === 'Mensualité').reduce((a,p) => a + p.mois.length, 0);
function finance(s){
  const c = classOf(s.classe), paid = paidMonths(s.id);
  const retard = Math.max(0, MOIS_DUS - paid);
  return {paid, retard, du: retard * c.mens, mens:c.mens, avance: Math.max(0, paid - MOIS_DUS), prochain: paid < MOIS.length ? paid : null};
}
function statusBadge(f){
  if(f.retard === 0) return f.avance ? `<span class="badge b-info">En avance</span>` : `<span class="badge b-ok">À jour</span>`;
  return `<span class="badge ${f.retard>1?'b-bad':'b-warn'}">${f.retard} mois de retard</span>`;
}
function average(sid){
  const s = studentById(sid), g = DB.grades[sid] || {};
  let tot = 0, coefs = 0;
  subjects(s.classe).forEach(([m,c]) => { if(g[m] != null && g[m] !== ''){ tot += g[m]*c; coefs += c; } });
  return coefs ? tot/coefs : null;
}
function ranking(cls){
  const list = DB.students.filter(s => s.classe === cls).map(s => ({s, moy:average(s.id)})).filter(x => x.moy != null);
  list.sort((a,b) => b.moy - a.moy);
  list.forEach((x,i) => x.rang = i + 1);
  return list;
}
const appreciation = m => m < 8 ? 'Insuffisant' : m < 10 ? 'Faible' : m < 12 ? 'Passable' : m < 14 ? 'Assez bien' : m < 16 ? 'Bien' : 'Très bien';
const distinction = m => m >= 16 ? 'Félicitations' : m >= 14 ? 'Encouragements' : m >= 12 ? 'Tableau d\'honneur' : m < 8 ? 'Avertissement' : '—';
const rankLabel = n => n === 1 ? '1er' : n + 'e';

    $('#pay-nb').innerHTML = left ? Array.from({length:Math.min(left,9)},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===def?'selected':''}>${n} mois</option>`).join('') : `<option value="0">Année soldée</option>`; upd(); };

function recordPayment(s, n, mode){

  const p = {id:DB.nextPid++, studentId:s.id, motif:'Mensualité', mois:Array.from({length:n},(_,i)=>f.paid+i), montant:n*c.mens, mode, date:todayISO()};

function bulletinHTML(sid){

  setHeader('Espace parent', 'Aperçu de l\'application mobile utilisée par les parents', '');
  if(!parentChild){ const late = DB.students.find(s => finance(s).retard > 0); parentChild = (late || DB.students[0]).id; }
  const s = studentById(parentChild), f = finance(s), c = classOf(s.classe), g = DB.grades[s.id] || {}, m = average(s.id);
  const rk = ranking(s.classe).find(x => x.s.id === s.id);
  const abs = DB.absences.filter(a => a.studentId === s.id).sort((a,b) => b.date.localeCompare(a.date));
  const ann = DB.messages.filter(x => !x.type && (x.dest === 'Toute l\'école' || x.dest === `Parents de ${s.classe}` || x.dest === s.classe)).slice(0,2);
  $('#view').innerHTML = `<div class="parent-layout">
  <div class="phone"><div class="screen">
    <div class="p-head"><small>Bonjour,</small><div style="font-weight:700;font-size:17px">${esc(s.parent)}</div>
      <select id="p-child" aria-label="Choisir l'enfant">${DB.students.slice(0,60).map(x => `<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(fullName(x))} – ${x.classe}</option>`).join('')}</select></div>
    <div class="p-body">
      <div class="p-card"><h5>Scolarité</h5>
        ${f.retard ? `<div class="p-amount" style="color:var(--red)">${fcfa(f.du)}</div><div class="muted" style="font-size:13px;margin-bottom:10px">à payer : ${MOIS.slice(f.paid, MOIS_DUS).join(', ')}</div>
          <div class="chips"><button class="btn wave" data-act="pay-mobile" data-mode="Wave" style="flex:1">Payer avec Wave</button><button class="btn om" data-act="pay-mobile" data-mode="Orange Money" style="flex:1">Orange Money</button></div>`
        : `<div class="p-amount" style="color:var(--green)">À jour ✓</div><div class="muted" style="font-size:13px;margin-bottom:10px">${f.paid} mois payés sur ${MOIS.length}${f.prochain!=null?' · prochain : '+MOIS[f.prochain]+' ('+fcfa(c.mens)+')':''}</div>
          ${f.prochain!=null?`<button class="btn wave" data-act="pay-mobile" data-mode="Wave" style="width:100%">Payer ${MOIS[f.prochain]} en avance</button>`:''}`}
      </div>
      <div class="p-card"><h5>Résultats · 1er trimestre</h5>
        <div class="row space"><div><span class="p-amount">${m!=null?m.toFixed(2):'—'}</span><span class="muted"> / 20</span></div>${rk?`<span class="badge b-info">${rankLabel(rk.rang)} sur ${ranking(s.classe).length}</span>`:''}</div>
        ${subjects(s.classe).slice(0,4).map(([mat]) => `<div class="list-item" style="padding:6px 0;font-size:13.5px"><span>${esc(mat)}</span><b>${g[mat]!=null?g[mat]:'—'}</b></div>`).join('')}
        <button class="btn sm" style="width:100%;margin-top:8px" data-act="bulletin" data-id="${s.id}">Voir le bulletin complet</button>
      </div>
      <div class="p-card"><h5>Absences & retards</h5>
        ${abs.length ? abs.slice(0,3).map(a => `<div class="list-item" style="padding:6px 0;font-size:13.5px"><span>${fdate(a.date)}</span><span class="badge ${a.type==='Absence'?'b-bad':'b-warn'}">${a.type}</span></div>`).join('') : '<span class="muted" style="font-size:13.5px">Aucune absence ce trimestre 👏</span>'}
      </div>
      <div class="p-card"><h5>Annonces de l'école</h5>
        ${ann.length ? ann.map(a => `<p style="margin:0 0 8px;font-size:13.5px"><small class="muted">${fdate(a.date)}</small><br>${esc(a.texte)}</p>`).join('') : '<span class="muted" style="font-size:13.5px">Aucune annonce.</span>'}
      </div>
    </div>
  </div></div>
  <div class="card"><h3>Ce que voit le parent</h3>
    <ul class="feature-list">
      <li><b>Situation de la scolarité</b> en temps réel, avec les mois restant dus.</li>
      <li><b>Paiement en un clic</b> par Wave, Orange Money ou Free Money ; le reçu arrive sur WhatsApp et l'école le voit immédiatement.</li>
      <li><b>Notes, moyenne, rang</b> et bulletin téléchargeable en PDF.</li>
      <li><b>Alerte immédiate</b> en cas d'absence ou de retard.</li>
      <li><b>Annonces de l'école</b> : réunions, congés, sorties.</li>
    </ul>
    <p class="muted" style="font-size:14px">Dans la version finale, cet espace sera une application installable (PWA) qui fonctionne sur les téléphones d'entrée de gamme, avec une version en wolof et des notifications WhatsApp pour les parents qui n'installent pas l'application.</p>
    <p class="muted" style="font-size:14px">Essayez : choisissez un enfant en retard de paiement, puis cliquez sur « Payer avec Wave ». Le paiement apparaît ensuite dans le tableau de bord de l'école.</p>
  </div></div>`;
  $('#p-child').onchange = e => { parentChild = +e.target.value; viewParent(); };
}
function payMobile(mode){
  const s = studentById(parentChild), f = finance(s), n = Math.max(1, f.retard), amount = n * f.mens;
  openModal(`<h2>Paiement ${mode}</h2><p class="muted" style="margin:0 0 14px">Scolarité de ${esc(fullName(s))} · ${MOIS.slice(f.paid, f.paid+n).join(', ')}</p>
    <div class="card" style="text-align:center"><div class="muted">Montant</div><div class="p-amount" style="font-size:30px">${fcfa(amount)}</div><div class="muted" style="font-size:13px">Bénéficiaire : ${SCHOOL.nom}</div></div>
    <form class="form" id="f-mob" style="margin-top:14px"><label>Numéro ${mode}<input class="input" value="${esc(s.tel)}" inputmode="tel" required></label>
    <div class="actions"><button type="button" class="btn" data-act="close">Annuler</button><button class="btn ${mode==='Wave'?'wave':'om'}" id="mob-ok">Confirmer le paiement</button></div></form>`);
  $('#f-mob').onsubmit = e => { e.preventDefault(); const b = $('#mob-ok'); b.disabled = true; b.textContent = 'Validez sur votre téléphone…';
    setTimeout(() => { const p = recordPayment(s, n, mode); showReceipt(p, `Paiement ${mode} reçu : ${fcfa(amount)} (simulation)`); }, 1400); };
}

/* ============ Actions globales ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const id = el.dataset.id;
  switch(el.dataset.act){
    case 'close': closeModal(); break;
    case 'fiche': openFiche(id); break;
    case 'inscrire': openInscription(); break;
    case 'encaisser': openEncaisser(id ? +id : null); break;
    case 'relancer': openRelance(id); break;
    case 'relancer-tous': relancerTous(el.dataset.classe || ''); break;
    case 'recu': openModal(`<h2>Reçu de paiement</h2>${receiptHTML(DB.payments.find(p => p.id === +id))}<div class="actions"><button class="btn" onclick="window.print()">🖨️ Imprimer</button><button class="btn primary" data-act="close">Fermer</button></div>`); break;
    case 'bulletin': openBulletin(id); break;
    case 'wa-recu': { const s = studentById(DB.payments.find(p => p.id === +id).studentId); toast(`Reçu envoyé par WhatsApp à ${s.parent} (simulation)`); break; }
    case 'wa-bulletin': { const s = studentById(id); toast(`Bulletin PDF envoyé par WhatsApp à ${s.parent} (simulation)`); break; }
    case 'pay-mobile': payMobile(el.dataset.mode); break;
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.matches('tr[data-act]')) e.target.click(); });
$('#reset').onclick = () => { if(confirm('Effacer vos modifications et recharger les données de démonstration ?')){ localStorage.removeItem(STORE); load(); parentChild = null; route(); toast('Démo réinitialisée'); } };

load(); renderNav();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
